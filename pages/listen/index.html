<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Слушать в EvPlayer</title>
<!-- Discord's "Слушать" button may only lead to an https page: this one hands the song on to
     the app (evplayer://play?...), and offers the app or the song's own page otherwise -->
<style>
  :root { --ink: #eef7f4; --ink-2: rgba(238, 247, 244, 0.68); --accent: #6ff0c4; --ground: #06201d; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 25% 30%, #1f8a73, var(--ground) 65%); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: min(420px, 100%); padding: 24px; border-radius: 26px; background: rgba(5, 16, 18, 0.6); border: 1px solid rgba(238, 247, 244, 0.12); text-align: center; }
  img { width: 160px; height: 160px; object-fit: cover; border-radius: 22px; display: none; margin: 0 auto 16px; }
  h1 { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  p { margin: 4px 0 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  a { display: block; padding: 12px; border-radius: 14px; color: var(--ink); text-decoration: none; background: rgba(238, 247, 244, 0.08); font-weight: 600; }
  a.primary { background: var(--accent); color: var(--ground); }
  .hint { font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<main class="card">
  <img id="art" alt="">
  <h1 id="title">Песня из EvPlayer</h1>
  <p id="artist"></p>
  <div class="actions">
    <a id="open" class="primary" href="#">Открыть в EvPlayer</a>
    <a href="https://github.com/Evire1337/evplayer/releases/latest">Скачать EvPlayer</a>
    <a id="source" href="#" hidden>Слушать на сайте</a>
  </div>
  <p class="hint">Если EvPlayer установлен, песня включится в нём сама.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const text = (k) => (q.get(k) || "").slice(0, 200);
  const https = (k) => (/^https:\/\//.test(q.get(k) || "") ? q.get(k) : "");
  if (text("t")) document.getElementById("title").textContent = text("t");
  document.getElementById("artist").textContent = text("a");
  const art = https("art");
  if (art) Object.assign(document.getElementById("art"), { src: art, style: "display:block" });
  const source = https("p");
  if (source) {
    const link = document.getElementById("source");
    link.href = source;
    link.textContent = /youtube|youtu\.be/.test(source) ? "Слушать на YouTube" : "Слушать на SoundCloud";
    link.hidden = false;
  }
  const app = "evplayer://play?" + q.toString();
  document.getElementById("open").href = app;
  if (/^(sc:\d+|yt:[\w-]{11})$/.test(q.get("id") || "")) location.href = app;
</script>
</body>
</html>
