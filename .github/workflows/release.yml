name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) and this builds the Windows
# installer and publishes it as a GitHub release, with latest.json for the updater.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the update signing key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      # built into a draft first and published only when every file is there, so a release
      # is never seen half-uploaded
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Установщик для Windows — файл EvPlayer_*_x64-setup.exe ниже. Уже установленные копии обновятся сами."
          releaseDraft: true
          includeUpdaterJson: true
      - name: Check every file landed in the release, then publish it
        shell: bash
        run: |
          FILES=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$FILES"
          echo "$FILES" | grep -q 'setup\.exe$' || { echo "missing the installer"; exit 1; }
          echo "$FILES" | grep -qx 'latest.json' || { echo "missing latest.json"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
