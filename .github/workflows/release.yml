name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) and this builds the Windows
# installer and publishes it as a GitHub release, with latest.json for the updater.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the update signing key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      # built into a draft first and published only when every file is there, so a release
      # is never seen half-uploaded
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Установщик для Windows — файл EvPlayer_*_x64-setup.exe ниже. Уже установленные копии обновятся сами."
          releaseDraft: true
          includeUpdaterJson: true
      # Copies of 0.3 and older (Electron) update through electron-updater, which reads
      # latest.yml: point it at this installer, so they move over to the new version by
      # themselves (src-tauri/windows/hooks.nsh removes the old program and starts the new one)
      - name: Add latest.yml for the Electron version's updater
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NAME=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep 'setup\.exe$' | head -1)
          [ "$NAME" = "$(basename "$EXE")" ] || { echo "installer name in the release ($NAME) differs from the built one ($EXE)"; exit 1; }
          SHA=$(openssl dgst -sha512 -binary "$EXE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE")
          cat > latest.yml <<YML
          version: ${GITHUB_REF_NAME#v}
          files:
            - url: $NAME
              sha512: $SHA
              size: $SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          cat latest.yml
          gh release upload "$GITHUB_REF_NAME" latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check every file landed in the release, then publish it
        shell: bash
        run: |
          FILES=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$FILES"
          echo "$FILES" | grep -q 'setup\.exe$' || { echo "missing the installer"; exit 1; }
          echo "$FILES" | grep -qx 'latest.json' || { echo "missing latest.json"; exit 1; }
          echo "$FILES" | grep -qx 'latest.yml' || { echo "missing latest.yml"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
