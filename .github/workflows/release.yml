name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) and this builds EvPlayer for
# Windows (x64), Linux (x64 and ARM: .deb, .rpm, AppImage, and a package for Arch) and Android, and publishes
# a GitHub release with latest.json for the updater. The release stays a draft until every
# computer's files are in it.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the update signing key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      # built into a draft first and published only when every file is there, so a release
      # is never seen half-uploaded
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Windows — EvPlayer_*_x64-setup.exe.
            Linux — .AppImage (обновляется сам), .deb, .rpm или пакет для Arch (.pkg.tar.zst, или PKGBUILD для makepkg); amd64/x86_64 — обычные компьютеры, arm64/aarch64 — ARM.
            Android — EvPlayer-*.apk.
            Уже установленные копии обновятся сами.
          releaseDraft: true
          includeUpdaterJson: true
      # Copies of 0.3 and older (Electron) update through electron-updater, which reads
      # latest.yml: point it at this installer, so they move over to the new version by
      # themselves (src-tauri/windows/hooks.nsh removes the old program and starts the new one)
      - name: Add latest.yml for the Electron version's updater
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NAME=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep 'setup\.exe$' | head -1)
          [ "$NAME" = "$(basename "$EXE")" ] || { echo "installer name in the release ($NAME) differs from the built one ($EXE)"; exit 1; }
          SHA=$(openssl dgst -sha512 -binary "$EXE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE")
          cat > latest.yml <<YML
          version: ${GITHUB_REF_NAME#v}
          files:
            - url: $NAME
              sha512: $SHA
              size: $SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          cat latest.yml
          gh release upload "$GITHUB_REF_NAME" latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the other computers, added to the same draft one after another (each adds its line to
  # latest.json, so they must not write it at the same time)
  desktop:
    needs: windows
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: Linux ARM
            runner: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.windows.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  publish:
    needs: [windows, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Check every file landed in the release, then publish it
        shell: bash
        run: |
          FILES=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$FILES"
          need() { echo "$FILES" | grep -Eq "$1" || { echo "missing: $2"; exit 1; }; }
          need '_x64-setup\.exe$' "the Windows installer"
          need '_amd64\.AppImage$' "the Linux x64 AppImage"
          need '_aarch64\.AppImage$' "the Linux ARM AppImage"
          need '_amd64\.deb$' "the Linux x64 .deb"
          need '_arm64\.deb$' "the Linux ARM .deb"
          need '^latest\.json$' "latest.json"
          need '^latest\.yml$' "latest.yml"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json -O latest.json
          for p in windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$p" '[.platforms | keys[] | select(startswith($p))] | length > 0' latest.json > /dev/null || { echo "latest.json has no $p"; cat latest.json; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the phone version: the same release gets an APK (the phone app offers it as an update)
  android:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "ANDROID_KEYSTORE secret is missing"; exit 1; }
          KS="$RUNNER_TEMP/evplayer.jks"
          echo "$KEYSTORE" | base64 -d > "$KS"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=evplayer\n' "$KS" "$KEY_PASSWORD" > src-tauri/gen/android/keystore.properties
      - name: Build the APK
        shell: bash
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          pnpm tauri android build --apk --target aarch64 armv7
      - name: Add it to the release
        shell: bash
        run: |
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          cp "$APK" "EvPlayer-${GITHUB_REF_NAME#v}.apk"
          gh release upload "$GITHUB_REF_NAME" "EvPlayer-${GITHUB_REF_NAME#v}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch Linux: the x64 .deb of this release, made into a pacman package with makepkg (Arch
  # images are x64 only; Arch Linux ARM builds the attached PKGBUILD itself)
  arch:
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed pacman-contrib github-cli
          VERSION="${GITHUB_REF_NAME#v}"
          useradd -m builder
          mkdir /home/builder/pkg
          sed "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          # the real checksums of this release's .deb files, for whoever builds it with makepkg
          sudo -u builder updpkgsums
          sudo -u builder makepkg --nodeps --noconfirm
          cp PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD"
          cp evplayer-bin-*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - name: Add it to the release
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" PKGBUILD evplayer-bin-*.pkg.tar.zst --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}