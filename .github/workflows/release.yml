name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) and this builds the Windows
# installer and publishes it as a GitHub release. Installed apps pick it up automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      # One release per tag: electron-builder uploads its files in parallel, and when no
      # release exists yet each upload may create its own, leaving the installer in one
      # release and the update files in another. So the draft is made first, filled, and
      # only then published.
      - name: Create the draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "EvPlayer ${GITHUB_REF_NAME#v}. Установщик для Windows — EvPlayer-Setup-${GITHUB_REF_NAME#v}.exe. Уже установленные копии обновятся сами."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check every file landed in the release, then publish it
        shell: bash
        run: |
          FILES=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$FILES"
          for f in "EvPlayer-Setup-${GITHUB_REF_NAME#v}.exe" "latest.yml"; do
            echo "$FILES" | grep -qx "$f" || { echo "missing $f"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
