name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) and this builds the Windows
# installer and publishes it as a GitHub release. Installed apps pick it up automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      - run: pnpm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
