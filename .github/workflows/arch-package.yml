# Adds the Arch package to a release that is already out (when the release run could not).
# Only by hand: push a tag named arch-<release tag>, e.g. arch-v0.7.5 (delete it afterwards).
name: Arch package

on:
  push:
    tags: ["arch-v*"]

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed pacman-contrib github-cli
          VERSION="${TAG#arch-v}"
          useradd -m builder
          mkdir /home/builder/pkg
          sed "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          sudo -u builder updpkgsums
          sudo -u builder makepkg --nodeps --noconfirm
          cp PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD"
          cp evplayer-bin-*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - name: Add it to the release
        shell: bash
        run: gh release upload "${TAG#arch-}" -R "$GITHUB_REPOSITORY" PKGBUILD evplayer-bin-*.pkg.tar.zst --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
