name: Check

on:
  push:
    branches: [tauri]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# a draft pull request gets the quick part only (the web checks and a Windows installer to
# try); the rest runs once it is marked ready, and on every push to tauri
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Placeholder page (the tests do not need the real one)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo test
        working-directory: src-tauri

  # a Windows installer from every push to the tauri branch, to try before a release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the installer (a test build, without the update signature)
        run: pnpm tauri build --config src-tauri/test-build.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: EvPlayer-test-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # the other computers: Linux (x64 and ARM) packages, to try
  # before a release
  # the Arch package (packaging/arch/PKGBUILD) still builds: from the latest release's .deb
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: makepkg
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed pacman-contrib github-cli
          VERSION=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          useradd -m builder
          mkdir /home/builder/pkg
          sed "s/^pkgver=.*/pkgver=${VERSION#v}/" packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          sudo -u builder updpkgsums
          sudo -u builder makepkg --nodeps --noconfirm
          # the program and its menu entry are in the package
          bsdtar -tf evplayer-bin-*.pkg.tar.zst | tee files.txt | grep -E '^usr/bin/'
          grep -E '^usr/share/applications/.+\.desktop$' files.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Build the packages (a test build, without the update signature)
        run: pnpm tauri build --bundles deb,rpm,appimage --config src-tauri/test-build.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: EvPlayer-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
