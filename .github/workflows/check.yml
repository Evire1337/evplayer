name: Check

on:
  push:
    branches: [desktop, tauri]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Placeholder page (the tests do not need the real one)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo test
        working-directory: src-tauri

  # a Windows installer from every push to the tauri branch, to try before a release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the installer (a test build, without the update signature)
        run: pnpm tauri build --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"
      - uses: actions/upload-artifact@v4
        with:
          name: EvPlayer-test-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
